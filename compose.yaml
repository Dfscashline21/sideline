name: sideline

# Local dev stack for the sideline monorepo.
# Secrets come from .env (copy .env.example -> .env); .env is gitignored.
#
#   docker compose up -d --wait   # start everything and wait for healthy
#   docker compose exec dev bash  # shell inside the dev container
#   docker compose down           # stop and remove containers (volumes kept)

services:
  # --- Object storage (raw landing zone) -----------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"        # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"    # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot job: creates the raw-data bucket once MinIO is healthy, then exits.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      (mc ls local/sideline-raw >/dev/null 2>&1 || mc mb local/sideline-raw) &&
      mc anonymous set none local/sideline-raw
      "

  # --- Relational store (later: fantasy league DB, M8.x) --------------------
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- DuckDB-ready dev container -------------------------------------------
  # Repo is bind-mounted at /workspace; `uv sync` runs on start so the
  # toolchain (ruff/mypy/pytest/duckdb) always matches uv.lock.
  dev:
    build:
      context: .
      dockerfile: infra/Dockerfile.dev
    env_file: .env
    working_dir: /workspace
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "uv sync --locked --dev && exec sleep infinity"]
    stdin_open: true
    tty: true

volumes:
  minio-data:
  postgres-data:
  uv-cache:
